# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── MySQL DataSource ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/indianewsdesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Thenick@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Seed data (runs once on startup if tables are empty) ──────
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ── App name ──────────────────────────────────────────────────
spring.application.name=IndiaNewsDesk
